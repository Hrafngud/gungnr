name: Release CLI Builds

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

env:
  RELEASE_VERSION: ${{ github.ref_name }}

jobs:
  build-cli:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build CLI artifact
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GUNGNR_VERSION: ${{ env.RELEASE_VERSION }}
          OUTPUT: dist/gungnr_${{ matrix.goos }}_${{ matrix.goarch }}
        run: ./scripts/build_gungnr.sh

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: gungnr-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/gungnr_${{ matrix.goos }}_${{ matrix.goarch }}
          if-no-files-found: error
